<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-label="Example final score at the end of a watcher: checks, errors, most open spots and result">
  <style>@font-face{font-family:'Bungee';src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'PressStart';src:url(data:font/woff2;base64,) format('woff2')}.b{font-family:'Bungee',Impact,sans-serif}.p{font-family:'PressStart','Courier New',monospace}</style>
  <defs>
    <pattern id="led" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#fff" opacity="0.05"/></pattern>
    <filter id="ledglow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="2" y="2" width="1196" height="346" rx="18" fill="#070c16" stroke="#1b2433" stroke-width="4"/>
  <rect x="2" y="2" width="1196" height="346" rx="18" fill="url(#led)"/>
  <rect x="2" y="2" width="1196" height="62" rx="18" fill="#d7263d"/><rect x="2" y="34" width="1196" height="30" fill="#d7263d"/><text class="b" x="600" y="46" font-size="26" fill="#fff" text-anchor="middle" >FINAL SCORE</text><text class="p" x="70" y="112" font-size="15" fill="#7f8ba3" text-anchor="start" >WINDOW</text><text class="p" x="400" y="112" font-size="15" fill="#ffb627" text-anchor="start" filter="url(#ledglow)">02:26 PM - 08:06 PM ET</text><text class="p" x="70" y="156" font-size="15" fill="#7f8ba3" text-anchor="start" >CHECKS</text><text class="p" x="400" y="156" font-size="15" fill="#ffb627" text-anchor="start" filter="url(#ledglow)">2,040</text><text class="p" x="70" y="200" font-size="15" fill="#7f8ba3" text-anchor="start" >ERRORS</text><text class="p" x="400" y="200" font-size="15" fill="#ffb627" text-anchor="start" filter="url(#ledglow)">0</text><text class="p" x="70" y="244" font-size="15" fill="#7f8ba3" text-anchor="start" >MOST SPOTS</text><text class="p" x="400" y="244" font-size="15" fill="#ffb627" text-anchor="start" filter="url(#ledglow)">1 OPEN ON CALENDLY</text><text class="p" x="70" y="288" font-size="15" fill="#7f8ba3" text-anchor="start" >RESULT</text><text class="p" x="400" y="288" font-size="15" fill="#ff4d4d" text-anchor="start" filter="url(#ledglow)">NO MONDAY SLOT YET</text><text class="p" x="1130" y="330" font-size="12" fill="#7f8ba3" text-anchor="end" >EXAMPLE</text>
</svg>
