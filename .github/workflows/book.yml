name: Book softball lesson

# Live runs are relay watchers: each one checks Calendly every minute for ~5h40m, then starts
# the next run itself, so there is always one watching. GitHub's schedule (often hours late)
# and cron-job.org only matter as a backup that restarts the relay if it ever breaks.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (fill the form and screenshot it, don't book)"
        type: boolean
        default: true
      simulate_open_slot:
        description: "Simulate an open Thursday 7 PM slot (tests the full flow, never books)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write   # lets the watcher start the next run

# One live watcher at a time (others wait, never cancel it). Test runs get their own group
# so they don't sit behind a 6-hour watcher.
concurrency:
  group: >-
    ${{ (github.event_name == 'workflow_dispatch' && (inputs.dry_run || inputs.simulate_open_slot))
        && format('book-test-{0}', github.run_id) || 'book-live' }}
  cancel-in-progress: false

jobs:
  book:
    # Real bookings (schedule, cron-job.org, or a manual run with dry_run off) only happen when
    # the repo variable BOT_ENABLED is "true". Dry runs and simulations always run.
    if: >-
      vars.BOT_ENABLED == 'true' ||
      (github.event_name == 'workflow_dispatch' && (inputs.dry_run || inputs.simulate_open_slot))
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      LIVE: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.dry_run || inputs.simulate_open_slot)) }}
    steps:
      - name: Note start time
        run: echo "STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run booking bot
        env:
          BOOK_NAME: ${{ secrets.BOOK_NAME }}
          BOOK_EMAIL: ${{ secrets.BOOK_EMAIL }}
          BOOK_PHONE: ${{ secrets.BOOK_PHONE }}
          BOOK_NOTES: ${{ secrets.BOOK_NOTES }}
          EVENT_SLUG: ${{ vars.EVENT_SLUG }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          SIMULATE_OPEN_SLOT: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate_open_slot && 'true' || 'false' }}
          WATCH_MINUTES: ${{ env.LIVE == 'true' && '340' || '0' }}
          WATCH_INTERVAL: "60"
        run: python book.py

      - name: Commit booked.json
        if: always()
        run: |
          if [ -f booked.json ] && [ -n "$(git status --porcelain booked.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add booked.json
            git commit -m "Record booked lesson date"
            git push
          fi

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: "*.png"
          retention-days: 1
          if-no-files-found: ignore

      # Hand off to the next watcher. Skipped if this run was cancelled (that's how you stop the
      # relay) or died within 20 minutes (so a broken setup can't spin; the schedule retries later).
      - name: Start the next watcher
        if: ${{ !cancelled() && env.LIVE == 'true' && vars.BOT_ENABLED == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          elapsed=$(( $(date +%s) - STARTED ))
          if [ "$elapsed" -lt 1200 ]; then
            echo "Run lasted only ${elapsed}s; not relaying (GitHub's schedule will restart it)."
            exit 0
          fi
          gh workflow run book.yml --repo "$GITHUB_REPOSITORY" --ref main -f dry_run=false -f simulate_open_slot=false
          echo "Next watcher queued."
